agent:
  name: "Hermes CTI"
  version: "0.1.0"
  log_level: "INFO"
  max_threads: 5

ingestion:
  update_interval_hours: 24
  timeout_seconds: 30
  connect_timeout_seconds: 10
  read_timeout_seconds: 30
  write_timeout_seconds: 10
  pool_timeout_seconds: 10
  max_redirects: 5
  verify_tls: true
  user_agent: "CTI-Hermes/0.1.0 (+https://github.com/mrcoggsworth/threat-intel-agent)"
  max_retries: 3
  retry_backoff_seconds: 0.5
  retry_max_delay_seconds: 30
  retry_jitter_seconds: 0.25

publisher:
  portal_output_dir: "./portal"

scheduler:
  timezone: "UTC"
  hour: 2
  stale_after_seconds: 86400

enrichment:
  enabled: true
  cache_ttl_seconds: 86400
  stale_if_error_seconds: 604800
  timeout_seconds: 20
  max_retries: 2
  max_response_bytes: 20971520
  concurrency: 2
  cisa_kev_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  epss_url: "https://api.first.org/data/v1/epss"
  nvd_url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
  virustotal_enabled: true
  virustotal_url: "https://www.virustotal.com/api/v3"
  otx_enabled: true
  otx_url: "https://otx.alienvault.com/api/v1"
  abuseipdb_enabled: true
  abuseipdb_url: "https://api.abuseipdb.com/api/v2"

# Runtime secrets and the database URL are intentionally supplied through
# HERMES_* environment variables, never committed to this file.
