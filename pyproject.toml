[project]
name = "threat-intel-agent"
version = "0.1.0"
description = "Hermes - Autonomous Threat Intelligence Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.11",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
