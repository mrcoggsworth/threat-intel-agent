title: Oracle WebLogic Proxy Plug-in Exploitation
id: 7c2e2d1f-5e8b-4c7e-8cc6-719a1bcab221
status: experimental
description: Detects HTTP requests and response-side indicators requiring investigation for active exploitation of CVE-2026-21962 against Oracle HTTP Server or WebLogic Server Proxy Plug-in.
author: Hermes Autonomous CTI Agent
references:
  - https://www.cisa.gov/news-events/alerts/2026/08/24/cisa-adds-one-known-exploited-vulnerability-catalog
  - https://nvd.nist.gov/vuln/detail/CVE-2026-21962
tags:
  - attack.initial-access
  - attack.t1190
logsource:
  category: webserver
  product: generic
detection:
  selection:
    cs-method:
      - GET
      - POST
      - PUT
      - DELETE
    cs-uri-stem|contains:
      - '/console/'
      - '/weblogic'
  condition: selection
falsepositives:
  - Normal Oracle administration and application traffic; correlate with 4xx/5xx spikes, unexpected data modification, or source reputation.
level: critical
