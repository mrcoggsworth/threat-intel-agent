title: E4del PINHOLE FTP Banner Dead-Drop Execution
id: f7dffef1-1f31-46e5-b0c7-0e3c433e78d7
status: experimental
description: Detects Windows process and network telemetry consistent with E4del or PINHOLE delivery through FTP banners and PowerShell.
author: Hermes Autonomous CTI Agent
references:
  - https://thehackernews.com/2026/08/e4del-and-pinhole-rats-turn-ftp-banners.html
  - https://socradar.io/blog/ftp-banners-new-dead-drop-resolver-rats/
tags:
  - attack.execution
  - attack.t1059.001
  - attack.command-and-control
  - attack.t1102.002
  - attack.command-and-control
  - attack.t1105
  - attack.defense-evasion
  - attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\\powershell.exe'
      - '\\cmd.exe'
    CommandLine|contains:
      - 'MSXML2.XMLHTTP'
      - 'cloudflare.milicare.in'
      - 'u.cmd'
      - 'ftp'
  condition: selection
falsepositives:
  - Legitimate PowerShell automation or FTP administration; require parent-child and network correlation.
level: high
