title: Microsoft 365 Session Theft and AiTM Sign-In Anomaly
id: 6d55ab44-8cb6-4854-82ed-f55a2e2a9d06
status: experimental
author: Hermes CTI Agent
references:
  - https://thehackernews.com/2026/08/mirage2fa-surge-hits-4500-us-and-eu.html
  - https://any.run/cybersecurity-blog/mirage2fa-phishing-targets-us-companies/
tags:
  - attack.credential-access
  - attack.t1539
  - attack.t1078.004
logsource:
  service: azure
  product: entra
detection:
  selection:
    OperationName|contains: 'SignIn'
    AuthenticationRequirement|contains:
      - 'multiFactorAuthentication'
      - 'singleFactorAuthentication'
    ResultType: '0'
  condition: selection
falsepositives:
  - Approved legacy authentication exceptions; validate with device compliance and session risk telemetry
level: high
