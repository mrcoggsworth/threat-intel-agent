title: miniOrange SAML Authentication Bypass Activity
id: 9b7e5ab8-07cb-4c26-a4f1-2d9a1b3e5f61
status: experimental
description: Detects requests to the miniOrange SAML SSO endpoint that should be correlated with forged SAML assertions, malformed signature errors, and privileged WordPress logins.
author: Hermes Autonomous CTI Agent
references:
  - https://patchstack.com/articles/one-slug-seven-editions-the-miniorange-saml-sso-bug-that-let-anyone-log-in-as-your-wordpress-admin/
  - https://nvd.nist.gov/vuln/detail/CVE-2026-15981
  - https://nvd.nist.gov/vuln/detail/CVE-2026-61979
tags:
  - attack.initial-access
  - attack.t1190
  - attack.credential-access
  - attack.t1606.002
  - attack.persistence
  - attack.t1078
logsource:
  category: webserver
  product: wordpress
detection:
  selection:
    cs-uri-stem|contains:
      - 'mo_saml'
      - 'samlresponse'
      - 'sso'
  condition: selection
falsepositives:
  - Legitimate SAML SSO; require correlation with malformed signature errors, new administrator sessions, or source IPs in the observed scanning set.
level: critical
