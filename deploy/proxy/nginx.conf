events {}

http {
    limit_req_zone $binary_remote_addr zone=public_rate:10m rate=20r/s;
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    upstream hermes_web { server web:8000; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        location = /__proxy_health { return 200 "ok\n"; add_header Content-Type text/plain; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location = /__proxy_health { return 200 "ok\n"; add_header Content-Type text/plain; }
        location ~ ^/api/v1/(admin|ops)(/|$) { return 404; }
        location / {
            limit_req zone=public_rate burst=40 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://hermes_web;
        }
    }

    server {
        listen 443 ssl;
        server_name ops.cti-hermes.local;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        location = /__proxy_health { return 200 "ok\n"; }
        location ~ ^/(api/v1/(admin|ops)|health/ready|version)(/|$) {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://hermes_web;
        }
        location / { return 404; }
    }
}
