services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      # Trust authentication is limited to this local development baseline.
      # Production must use runtime-managed credentials and TLS.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hermes-postgres-dev:/var/lib/postgresql/data

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HERMES_ENVIRONMENT: development
      HERMES_DATABASE_URL: postgresql+asyncpg://hermes@postgres:5432/hermes
      HERMES_DATABASE_REQUIRED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HERMES_ENVIRONMENT: development
      HERMES_DATABASE_URL: postgresql+asyncpg://hermes@postgres:5432/hermes
      HERMES_DATABASE_REQUIRED: "true"
      HERMES_SCHEDULE_TIMEZONE: UTC
    depends_on:
      postgres:
        condition: service_healthy
    command: ["hermes-cti-scheduler"]
    restart: unless-stopped

volumes:
  hermes-postgres-dev:
